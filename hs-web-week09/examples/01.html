<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>9주차 예제 1 · 켜는 곳은 자식이 아니라 부모입니다</title>
  <style>
    /*
    9주차 예제 1 — 켜는 곳은 자식이 아니라 부모입니다
    */
    body {
      background: linear-gradient(to right, red, orange, yellow, green, blue, indigo, violet); /* 배경을 무지개색 그라데이션으로 지정 */
      /* 위에서 아래로 떨어지는 그라데이션을 원한다면 'to right, ' 부분을 지워주세요. */
    }
    
    .container {        /* ← 부모(flex container)에 선언 */
      display: flex;
    }
    /* .container의 자식들(flex item)이 자동으로 가로로 늘어섭니다. */
  </style>
</head>
<body>
  <h1>제목 h1</h1>
  <p class="intro">문단 p — 위에 작성한 CSS가 이 견본 문서에 적용됩니다.</p>

  </ul>
